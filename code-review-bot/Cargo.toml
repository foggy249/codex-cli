[package]
name = "code-review-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
codex-agent-core = { path = "../agent-framework/crates/codex-agent-core" }
codex-agent-tools = { path = "../agent-framework/crates/codex-agent-tools" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
